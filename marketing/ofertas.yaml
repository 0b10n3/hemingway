  situacao: disponível
  # Fonte: apps/skill_test/docs/metodologia.md §1–§5 (2026-11-09).
  resumo: "Diagnóstico gratuito de conhecimento técnico: 15 questões, escolhidas pela senioridade declarada, em cinco dimensões (mercados e produtos, de renda fixa bancária a crédito estruturado; matemática financeira e quant; dados e programação; IA aplicada; risco e regulação). O resultado compara o perfil com o que o mercado espera para o próximo degrau da carreira e aponta as duas dimensões em que investir primeiro."
