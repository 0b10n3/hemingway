" transform="translate(0,14.5)" style="opacity: 1;"><text class="legendtext" text-anchor="start" x="40" y="4.680000000000001" style="font-size: 12px; fill: rgb(20, 20, 20); fill-opacity: 1; white-space: pre;">Regra linear (Taxa LCA / (1 − IR))</text><g class="layers"><g class="legendfill"/><g class="legendlines"><path class="js-line" d="M5,0h30" style="fill: none; stroke: rgb(27, 106, 69); stroke-opacity: 1; stroke-width: 2.5px;"/></g><g class="legendsymbols"><g class="legendpoints"><path class="scatterpts" transform="translate(20,0)" d="M3.5,0A3.5,3.5 0 1,1 0,-3.5A3.5,3.5 0 0,1 3.5,0Z" style="opacity: 1; stroke-width: 0px; fill: rgb(27, 106, 69); fill-opacity: 1;"/></g></g></g><rect class="legendtoggle" x="0" y="-9.5" width="210.046875" height="19" style="fill: rgb(0, 0, 0); fill-opacity: 0;"/></g><g class="traces" transform="translate(212.546875,14.5)" style="opacity: 1;"><text class="legendtext" text-anchor="start" x="40" y="4.680000000000001" style="font-size: 12px; fill: rgb(20, 20, 20); fill-opacity: 1; white-space: pre;">Break-even real (juros compostos)</text><g class="layers"><g class="legendfill"><path class="js-fill" d="M5,0h30v6h-30z" style="stroke-width: 0; fill: rgb(45, 158, 103); fill-opacity: 0.15;"/></g><g class="legendlines"><path class="js-line" d="M5,0h30" style="fill: none; stroke: rgb(45, 158, 103); stroke-opacity: 1; stroke-width: 2.5px;"/></g><g class="legendsymbols"><g class="legendpoints"><path class="scatterpts" transform="translate(20,0)" d="M3.5,0A3.5,3.5 0 1,1 0,-3.5A3.5,3.5 0 0,1 3.5,0Z" style="opacity: 1; stroke-width: 0px; fill: rgb(45, 158, 103); fill-opacity: 1;"/></g></g></g><rect class="legendtoggle" x="0" y="-9.5" width="208.11328125" height="19" style="fill: rgb(0, 0, 0); fill-opacity: 0;"/></g></g></g><rect class="scrollbar" rx="20" ry="3" width="0" height="0" style="fill: rgb(128, 139, 164); fill-opacity: 1;" x="0" y="0"/></g><g class="g-gtitle"><text class="gtitle" x="22" y="55" text-anchor="start" dy="0em" style="opacity: 1; font-family: Montserrat; font-size: 18px; fill: rgb(20, 20, 20); fill-opacity: 1; white-space: pre;">Quanto a regra linear superestima o CDB equivalente à LCA — e por quê</text></g><g class="g-xtitle"/><g class="g-ytitle"><text class="ytitle" transform="rotate(-90,18.55625,310)" x="18.55625" y="310" text-anchor="middle" style="opacity: 1; font-size: 16px; fill: rgb(20, 20, 20); fill-opacity: 1; white-space: pre;">% do CDI</text></g><g class="annotation" data-index="0" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,614.01,418.33000000000004)"><g class="cursor-pointer" transform="translate(525,401)"><rect class="bg" x="0.5" y="0.5" width="177" height="33" style="stroke-width: 1px; stroke: rgb(226, 232, 240); stroke-opacity: 1; fill: rgb(247, 247, 245); fill-opacity: 1;"/><text class="annotation-text" text-anchor="middle" x="88.8046875" y="13" style="font-size: 12px; fill: rgb(20, 20, 20); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="88.8046875" y="13">o erro cresce de 0.8 p.p. em 6 meses</tspan><tspan class="line" dy="1.3em" x="88.8046875" y="13">para 4.3 p.p. em 5 anos</tspan></text></g></g><g class="annotation-arrow-g" style="opacity: 1;"><path d="M614.01,401.83000000000004L614.01,363.33000000000004" style="stroke-width: 1px; stroke: rgb(74, 85, 104); stroke-opacity: 1; stroke-dasharray: 0px, 0px, 37.2px, 38.5px;"/><path d="M-3.7,-2.5V2.5L1.3,0Z" transform="translate(614.010009765625,364.6299743652344)rotate(-90)" style="fill: rgb(74, 85, 104); stroke-width: 0;"/></g></g><g class="annotation" data-index="1" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,357.5,582.5)"><g class="cursor-pointer" transform="translate(70,567)"><rect class="bg" x="0.5" y="0.5" width="574" height="30" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="start" x="2" y="12" style="font-size: 11px; fill: rgb(74, 85, 104); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="2" y="12">Área sombreada = quanto a regra linear (gross-up simples) exagera o CDB equivalente frente ao break-even por juros compostos.</tspan><tspan class="line" dy="1.3em" x="2" y="12">CDI 14% a.a. · LCA a 90% do CDI · IR do CDB regressivo por prazo (20% até 6m, 17,5% até 1a, 15% acima de 2a).</tspan></text></g></g></g><g class="annotation" data-index="2" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,286,626)"><g class="cursor-pointer" transform="translate(70,618)"><rect class="bg" x="0.5" y="0.5" width="431" height="15" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="216.09375" y="11" style="font-family: 'IBM Plex Mono'; font-size: 10px; fill: rgb(74, 85, 104); fill-opacity: 1; white-space: pre;">Fonte: processo/07-verificacao.md (etapa 7, item 2) — CDI de 14% a.a. é valor didático, não a taxa do dia.</text></g></g></g></g></svg>