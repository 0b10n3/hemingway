n-arrow-g" style="opacity: 1;"><path d="M126.77000000000001,904.91L60.77,926.91" style="stroke-width: 1px; stroke: rgb(95, 125, 28); stroke-opacity: 1; stroke-dasharray: 0px, 0px, 68.2701px, 69.5701px;"/><path d="M-3.7,-2.5V2.5L1.3,0Z" transform="translate(62.003292083740234,926.4989013671875)rotate(161.56850710200976)" style="fill: rgb(95, 125, 28); stroke-width: 0;"/></g></g><g class="annotation" data-index="2" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,618.47,312.76)"><g class="cursor-pointer" transform="translate(547,297)"><rect class="bg" x="0.5" y="0.5" width="142" height="30" style="stroke-width: 1px; stroke: rgb(226, 232, 240); stroke-opacity: 1; fill: rgb(247, 247, 245); fill-opacity: 1;"/><text class="annotation-text" text-anchor="middle" x="71.046875" y="12" style="font-size: 11px; fill: rgb(20, 20, 20); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="71.046875" y="12">passo 14 (x₀=0,2001): 0,7630</tspan><tspan class="line" dy="1.3em" x="71.046875" y="12">mesma fórmula, destino oposto</tspan></text></g></g><g class="annotation-arrow-g" style="opacity: 1;"><path d="M630.47,327.76L658.47,362.76" style="stroke-width: 1px; stroke: rgb(95, 125, 28); stroke-opacity: 1; stroke-dasharray: 0px, 0px, 43.5219px, 44.8219px;"/><path d="M-3.7,-2.5V2.5L1.3,0Z" transform="translate(657.6578979492188,361.744873046875)rotate(51.35657835479047)" style="fill: rgb(95, 125, 28); stroke-width: 0;"/></g></g><g class="annotation" data-index="3" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,274,1033.5)"><g class="cursor-pointer" transform="translate(60,1009)"><rect class="bg" x="0.5" y="0.5" width="427" height="48" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="start" x="2" y="13" style="font-size: 12px; fill: rgb(74, 85, 104); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="2" y="13">Cada degrau é um passo da recorrência (x_seguinte = 4·x·(1−x)): sobe até a curva preta,</tspan><tspan class="line" dy="1.3em" x="2" y="13">vira na diagonal pontilhada. As duas trajetórias (0,2000 e 0,2001) desenham o mesmo</tspan><tspan class="line" dy="2.6em" x="2" y="13">degrau nos primeiros passos e se separam por completo depois do décimo quarto.</tspan></text></g></g></g><g class="annotation" data-index="4" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,225,1139.5)"><g class="cursor-pointer" transform="translate(60,1125)"><rect class="bg" x="0.5" y="0.5" width="329" height="28" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="164.8125" y="11" style="font-family: 'IBM Plex Mono'; font-size: 10px; fill: rgb(74, 85, 104); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="164.8125" y="11">Fonte: recorrência do mapa logístico (Robert May, Nature, 1976), recalculada em</tspan><tspan class="line" dy="1.3em" x="164.8125" y="11">processo/07-verificacao.md (etapa 7, item 1), 2026-09-23.</tspan></text></g></g></g></g></svg>