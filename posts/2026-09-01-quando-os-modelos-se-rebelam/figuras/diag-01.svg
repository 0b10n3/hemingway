opacity: 1; font-family: 'Space Grotesk', sans-serif; font-size: 17px; fill: rgb(20, 20, 20); fill-opacity: 1; white-space: pre;">O ciclo de liquidez que derrubou o LTCM (agosto-setembro de 1998)</text></g><g class="annotation" data-index="0" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,211.17,157.12)"><g class="cursor-pointer" transform="translate(172,138)"><rect class="bg" x="0.5" y="0.5" width="77" height="37" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="38.9375" y="15" style="font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; fill: rgb(255, 255, 255); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="38.9375" y="15">Calote russo</tspan><tspan class="line" dy="1.3em" x="38.9375" y="15">17/08/1998</tspan></text></g></g></g><g class="annotation" data-index="1" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,517.48,157.12)"><g class="cursor-pointer" transform="translate(457,138)"><rect class="bg" x="0.5" y="0.5" width="119" height="37" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="60.0390625" y="15" style="font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; fill: rgb(255, 255, 255); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="60.0390625" y="15">Fuga global para</tspan><tspan class="line" dy="1.3em" x="60.0390625" y="15">qualidade e liquidez</tspan></text></g></g></g><g class="annotation" data-index="2" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,877.84,304.78999999999996)"><g class="cursor-pointer" transform="translate(817,286)"><rect class="bg" x="0.5" y="0.5" width="121" height="37" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="60.5078125" y="15" style="font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; fill: rgb(255, 255, 255); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="60.5078125" y="15">Spreads divergem,</tspan><tspan class="line" dy="1.3em" x="60.5078125" y="15">em vez de convergir</tspan></text></g></g></g><g class="annotation" data-index="3" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,877.84,506.16)"><g class="cursor-pointer" transform="translate(843,487)"><rect class="bg" x="0.5" y="0.5" width="68" height="37" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="34.578125" y="15" style="font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; fill: rgb(255, 255, 255); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="34.578125" y="15">Chamadas</tspan><tspan class="line" dy="1.3em" x="34.578125" y="15">de margem</tspan></text></g></g></g><g class="annotation" data-index="4" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,517.48,506.16)"><g class="cursor-pointer" transform="translate(465,487)"><rect class="bg" x="0.5" y="0.5" width="104" height="37" style="stroke-width: 1px; stroke: rgb(0, 0, 0); stroke-opacity: 0; fill: rgb(0, 0, 0); fill-opacity: 0;"/><text class="annotation-text" text-anchor="middle" x="52.46875" y="15" style="font-family: 'Hanken Grotesk', sans-serif; font-size: 13px; fill: rgb(255, 255, 255); fill-opacity: 1; white-space: pre;"><tspan class="line" dy="0em" x="52.46875" y="15">LTCM vende para</tspan><tspan class="line" dy="1.3em" x="52.46875" y="15">cobrir a margem</tspan></text></g></g></g><g class="annotation" data-index="5" style="opacity: 1;"><g class="annotation-text-g" transform="rotate(0,517.48,304.78999999999996)"><g class="cursor-pointer" transform="translate(426,286)"><rect class="bg" x="0.5" y="0.5" width="181" height="37